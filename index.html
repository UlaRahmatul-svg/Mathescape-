    }

    .brand {

      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;

      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 6px 15px rgba(236, 72, 153, 0.3);
    }

    .brand-text h1 {
      font-size: 1.35rem;
      background: linear-gradient(90deg, var(--primary-dark), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: 2px solid transparent;
      background: #f8fafc;
      color: var(--text-muted);
      padding: 9px 15px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      background: #fdf2f8;
      color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.28);
    }

    main {
      max-width: 1140px;
      margin: 24px auto;
      padding: 0 18px;
    }

    .section-view {
      display: none;
      animation: fadeIn 0.35s ease;
    }
    .section-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-card {
      background: var(--card-bg);
      border-radius: 26px;
      padding: 28px;
      border: 2px solid #fbcfe8;
      box-shadow: var(--shadow);

      grid-template-columns: 240px 1fr;
      gap: 28px;
      align-items: center;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
